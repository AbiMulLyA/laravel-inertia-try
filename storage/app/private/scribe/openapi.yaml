openapi: 3.0.3
info:
  title: 'Kominfo Laravel Inertia Base - API Documentation'
  description: 'REST API untuk mengakses data aplikasi termasuk Categories, Projects, Tasks, Users, Roles, dan Permissions.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nAPI untuk autentikasi dan manajemen token menggunakan JWT"
  -
    name: Categories
    description: "\nAPI untuk manajemen kategori"
  -
    name: Permissions
    description: "\nAPI untuk manajemen permission"
  -
    name: Projects
    description: "\nAPI untuk manajemen proyek"
  -
    name: Roles
    description: "\nAPI untuk manajemen role"
  -
    name: Tasks
    description: "\nAPI untuk manajemen tugas/kegiatan"
  -
    name: Users
    description: "\nAPI untuk manajemen user"
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login and get access token'
      operationId: loginAndGetAccessToken
      description: 'Authenticate user with email and password, returns JWT token on success.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email atau password salah.'
                  errors:
                    email:
                      - 'Email atau password salah.'
                properties:
                  message:
                    type: string
                    example: 'Email atau password salah.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'Email atau password salah.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address."
                  example: user@example.com
                password:
                  type: string
                  description: "The user's password."
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Register new user'
      operationId: registerNewUser
      description: 'Create a new user account and return JWT token.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Registrasi berhasil'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Registrasi berhasil'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's full name."
                  example: 'John Doe'
                email:
                  type: string
                  description: "The user's email address."
                  example: user@example.com
                password:
                  type: string
                  description: "The user's password (min 8 characters)."
                  example: password123
                password_confirmation:
                  type: string
                  description: 'Password confirmation.'
                  example: password123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log the user out (Invalidate the token)'
      operationId: logTheUserOutInvalidateTheToken
      description: 'Invalidates the current JWT token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Logout berhasil'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Logout berhasil'
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh a token'
      operationId: refreshAToken
      description: 'Get a new token using the current valid token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
      tags:
        - Authentication
  /api/v1/auth/user:
    get:
      summary: 'Get the authenticated User'
      operationId: getTheAuthenticatedUser
      description: "Returns the currently authenticated user's information."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
      tags:
        - Authentication
  /api/v1/categories:
    get:
      summary: 'Get all categories'
      operationId: getAllCategories
      description: ''
      parameters:
        -
          in: query
          name: with_stats
          description: 'Include project statistics.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Include project statistics.'
            example: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      id: 1
                      code: CAT001
                      name: 'Category 1'
                      description: Description
                      is_active: true
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        code: CAT001
                        name: 'Category 1'
                        description: Description
                        is_active: true
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        code:
                          type: string
                          example: CAT001
                        name:
                          type: string
                          example: 'Category 1'
                        description:
                          type: string
                          example: Description
                        is_active:
                          type: boolean
                          example: true
      tags:
        - Categories
    post:
      summary: 'Create new category'
      operationId: createNewCategory
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Category created successfully'
                  data:
                    id: 1
                    code: CAT001
                    name: Infrastructure
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Category created successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      code:
                        type: string
                        example: CAT001
                      name:
                        type: string
                        example: Infrastructure
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Category code, max 20 chars, unique.'
                  example: CAT001
                name:
                  type: string
                  description: 'Category name, max 255 chars.'
                  example: Infrastructure
                description:
                  type: string
                  description: 'optional Description.'
                  example: 'Infrastructure projects'
                  nullable: true
                is_active:
                  type: boolean
                  description: 'optional Active status.'
                  example: true
              required:
                - code
                - name
  '/api/v1/categories/{category_id}':
    get:
      summary: 'Get single category'
      operationId: getSingleCategory
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    id: 1
                    code: CAT001
                    name: 'Category 1'
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      code:
                        type: string
                        example: CAT001
                      name:
                        type: string
                        example: 'Category 1'
      tags:
        - Categories
    put:
      summary: 'Update category'
      operationId: updateCategory
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: ''
                  example: null
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
              required:
                - name
    delete:
      summary: 'Delete category'
      operationId: deleteCategory
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Category deleted successfully'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Category deleted successfully'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Cannot delete category with associated projects'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Cannot delete category with associated projects'
      tags:
        - Categories
    parameters:
      -
        in: path
        name: category_id
        description: 'The ID of the category.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: category
        description: 'The category ID.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/permissions:
    get:
      summary: 'Get all permissions'
      operationId: getAllPermissions
      description: ''
      parameters:
        -
          in: query
          name: grouped
          description: "Return grouped by 'group' field."
          example: true
          required: false
          schema:
            type: boolean
            description: "Return grouped by 'group' field."
            example: true
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Permissions
    post:
      summary: 'Create new permission'
      operationId: createNewPermission
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Unique permission name.'
                  example: users.create
                display_name:
                  type: string
                  description: 'Display name.'
                  example: 'Create Users'
                description:
                  type: string
                  description: 'optional Description.'
                  example: 'Allows creating new users'
                  nullable: true
                group:
                  type: string
                  description: 'Permission group.'
                  example: Users
              required:
                - name
                - display_name
                - group
  /api/v1/permissions/groups:
    get:
      summary: 'Get unique permission groups'
      operationId: getUniquePermissionGroups
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Permissions
  '/api/v1/permissions/{permission_id}':
    get:
      summary: 'Get single permission'
      operationId: getSinglePermission
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Permissions
    put:
      summary: 'Update permission'
      operationId: updatePermission
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                display_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                description:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: 'Animi quos velit et fugiat.'
                  nullable: true
                group:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: d
              required:
                - name
                - display_name
                - group
    delete:
      summary: 'Delete permission'
      operationId: deletePermission
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Permissions
    parameters:
      -
        in: path
        name: permission_id
        description: 'The ID of the permission.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: permission
        description: 'The permission ID.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/projects:
    get:
      summary: 'Get all projects with pagination'
      operationId: getAllProjectsWithPagination
      description: ''
      parameters:
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Items per page.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Items per page.'
            example: 15
        -
          in: query
          name: category_id
          description: 'Filter by category ID.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter by category ID.'
            example: 1
        -
          in: query
          name: status
          description: 'Filter by status (draft, active, completed).'
          example: active
          required: false
          schema:
            type: string
            description: 'Filter by status (draft, active, completed).'
            example: active
        -
          in: query
          name: search
          description: 'Search by name or code.'
          example: project
          required: false
          schema:
            type: string
            description: 'Search by name or code.'
            example: project
        -
          in: query
          name: year
          description: 'Filter by year.'
          example: 2024
          required: false
          schema:
            type: integer
            description: 'Filter by year.'
            example: 2024
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Projects
    post:
      summary: 'Create new project'
      operationId: createNewProject
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: architecto
                code:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: 'n'
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                year:
                  type: integer
                  description: 'Must be at least 2020. Must not be greater than 2100.'
                  example: 1
                budget:
                  type: number
                  description: 'Must be at least 0.'
                  example: 42
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - draft
                    - active
                    - completed
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-12-30T01:48:09'
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>start_date</code>.'
                  example: '2052-01-23'
                  nullable: true
              required:
                - category_id
                - code
                - name
                - year
                - budget
                - status
  /api/v1/projects/summary:
    get:
      summary: 'Get project summary statistics'
      operationId: getProjectSummaryStatistics
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Projects
  '/api/v1/projects/{project_id}':
    get:
      summary: 'Get single project'
      operationId: getSingleProject
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Projects
    put:
      summary: 'Update project'
      operationId: updateProject
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: architecto
                code:
                  type: string
                  description: ''
                  example: null
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                year:
                  type: integer
                  description: 'Must be at least 2020. Must not be greater than 2100.'
                  example: 1
                budget:
                  type: number
                  description: 'Must be at least 0.'
                  example: 42
                spent:
                  type: number
                  description: 'Must be at least 0.'
                  example: 37
                  nullable: true
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - draft
                    - active
                    - completed
                start_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-12-30T01:48:09'
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>start_date</code>.'
                  example: '2052-01-23'
                  nullable: true
              required:
                - category_id
                - name
                - year
                - budget
                - status
    delete:
      summary: 'Delete project'
      operationId: deleteProject
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Projects
    parameters:
      -
        in: path
        name: project_id
        description: 'The ID of the project.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: project
        description: 'The project ID.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/roles:
    get:
      summary: 'Get all roles'
      operationId: getAllRoles
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Roles
    post:
      summary: 'Create new role'
      operationId: createNewRole
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Unique role name.'
                  example: manager
                display_name:
                  type: string
                  description: 'Display name.'
                  example: Manager
                description:
                  type: string
                  description: 'optional Description.'
                  example: 'Manager role'
                  nullable: true
                color:
                  type: string
                  description: 'Hex color code.'
                  example: '#3B82F6'
                is_default:
                  type: boolean
                  description: 'optional Set as default.'
                  example: false
                permissions:
                  type: array
                  description: 'optional Array of permission IDs.'
                  example:
                    - 1
                    - 2
                    - 3
                  items:
                    type: string
              required:
                - name
                - display_name
                - color
  /api/v1/roles/permissions:
    get:
      summary: 'Get available permissions grouped'
      operationId: getAvailablePermissionsGrouped
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Roles
  '/api/v1/roles/{role_id}':
    get:
      summary: 'Get single role with permissions'
      operationId: getSingleRoleWithPermissions
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
