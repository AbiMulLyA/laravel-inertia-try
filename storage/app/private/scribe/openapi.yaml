openapi: 3.0.3
info:
  title: 'Kominfo Laravel Inertia Base - API Documentation'
  description: 'REST API untuk mengakses data aplikasi termasuk Categories, Projects, Tasks, Users, Roles, dan Permissions.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nAPI untuk autentikasi dan manajemen token menggunakan JWT"
  -
    name: Categories
    description: "\nAPI untuk manajemen kategori"
  -
    name: Permissions
    description: "\nAPI untuk manajemen permission"
  -
    name: Projects
    description: "\nAPI untuk manajemen proyek"
  -
    name: Roles
    description: "\nAPI untuk manajemen role"
  -
    name: Tasks
    description: "\nAPI untuk manajemen tugas/kegiatan"
  -
    name: Users
    description: "\nAPI untuk manajemen user"
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login and get access token'
      operationId: loginAndGetAccessToken
      description: 'Authenticate user with email and password, returns JWT token on success.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Login successful'
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'validation error'
                    type: object
                    example:
                      code: 422
                      message: 'Email atau password salah.'
                      errors:
                        email:
                          - 'Email atau password salah.'
                    properties:
                      code:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: 'Email atau password salah.'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'Email atau password salah.'
                            items:
                              type: string
                  -
                    description: 'invalid email format'
                    type: object
                    example:
                      code: 422
                      message: 'Validation error'
                      errors:
                        email:
                          - 'The email field must be a valid email address.'
                    properties:
                      code:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: 'Validation error'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email field must be a valid email address.'
                            items:
                              type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address."
                  example: user@example.com
                password:
                  type: string
                  description: "The user's password."
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/auth/register:
    post:
      summary: 'Register new user'
      operationId: registerNewUser
      description: 'Create a new user account and return JWT token.'
      parameters: []
      responses:
        201:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 201
                  message: 'Registration successful'
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: 'Registration successful'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'email already exists'
                    type: object
                    example:
                      code: 422
                      message: 'Validation error'
                      errors:
                        email:
                          - 'The email has already been taken.'
                    properties:
                      code:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: 'Validation error'
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email has already been taken.'
                            items:
                              type: string
                  -
                    description: 'password too short'
                    type: object
                    example:
                      code: 422
                      message: 'Validation error'
                      errors:
                        password:
                          - 'The password field must be at least 8 characters.'
                    properties:
                      code:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: 'Validation error'
                      errors:
                        type: object
                        properties:
                          password:
                            type: array
                            example:
                              - 'The password field must be at least 8 characters.'
                            items:
                              type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's full name."
                  example: 'John Doe'
                email:
                  type: string
                  description: "The user's email address."
                  example: user@example.com
                password:
                  type: string
                  description: "The user's password (min 8 characters)."
                  example: password123
                password_confirmation:
                  type: string
                  description: 'Password confirmation.'
                  example: password123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Log the user out (Invalidate the token)'
      operationId: logTheUserOutInvalidateTheToken
      description: 'Invalidates the current JWT token.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Logout successful'
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Logout successful'
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh a token'
      operationId: refreshAToken
      description: 'Get a new token using the current valid token.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Token refreshed'
                  data:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                    token_type: bearer
                    expires_in: 3600
                    user:
                      id: 1
                      name: 'John Doe'
                      email: user@example.com
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Token refreshed'
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: user@example.com
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
      tags:
        - Authentication
  /api/v1/auth/user:
    get:
      summary: 'Get the authenticated User'
      operationId: getTheAuthenticatedUser
      description: "Returns the currently authenticated user's information."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'User data retrieved'
                  data:
                    id: 1
                    name: 'John Doe'
                    email: user@example.com
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'User data retrieved'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'John Doe'
                      email:
                        type: string
                        example: user@example.com
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
      tags:
        - Authentication
  /api/v1/categories:
    get:
      summary: 'Get all categories'
      operationId: getAllCategories
      description: ''
      parameters:
        -
          in: query
          name: with_stats
          description: 'Include project statistics.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Include project statistics.'
            example: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: success
                    type: object
                    example:
                      code: 200
                      message: 'Categories retrieved successfully'
                      data:
                        -
                          id: 1
                          code: CAT001
                          name: 'Category 1'
                          description: Description
                          is_active: true
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: 'Categories retrieved successfully'
                      data:
                        type: array
                        example:
                          -
                            id: 1
                            code: CAT001
                            name: 'Category 1'
                            description: Description
                            is_active: true
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            code:
                              type: string
                              example: CAT001
                            name:
                              type: string
                              example: 'Category 1'
                            description:
                              type: string
                              example: Description
                            is_active:
                              type: boolean
                              example: true
                  -
                    description: 'with stats'
                    type: object
                    example:
                      code: 200
                      message: 'Categories retrieved successfully'
                      data:
                        -
                          id: 1
                          code: CAT001
                          name: 'Category 1'
                          description: Description
                          is_active: true
                          total_projects: 5
                          total_budget: 100000000
                          total_spent: 50000000
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: 'Categories retrieved successfully'
                      data:
                        type: array
                        example:
                          -
                            id: 1
                            code: CAT001
                            name: 'Category 1'
                            description: Description
                            is_active: true
                            total_projects: 5
                            total_budget: 100000000
                            total_spent: 50000000
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            code:
                              type: string
                              example: CAT001
                            name:
                              type: string
                              example: 'Category 1'
                            description:
                              type: string
                              example: Description
                            is_active:
                              type: boolean
                              example: true
                            total_projects:
                              type: integer
                              example: 5
                            total_budget:
                              type: integer
                              example: 100000000
                            total_spent:
                              type: integer
                              example: 50000000
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
      tags:
        - Categories
    post:
      summary: 'Create new category'
      operationId: createNewCategory
      description: ''
      parameters: []
      responses:
        201:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 201
                  message: 'Category created successfully'
                  data:
                    id: 1
                    code: CAT001
                    name: Infrastructure
                    description: 'Infrastructure projects'
                    is_active: true
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: 'Category created successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      code:
                        type: string
                        example: CAT001
                      name:
                        type: string
                        example: Infrastructure
                      description:
                        type: string
                        example: 'Infrastructure projects'
                      is_active:
                        type: boolean
                        example: true
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
        422:
          description: 'validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 422
                  message: 'Validation error'
                  errors:
                    code:
                      - 'The code has already been taken.'
                properties:
                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'Validation error'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The code has already been taken.'
                        items:
                          type: string
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Category code, max 20 chars, unique.'
                  example: CAT001
                name:
                  type: string
                  description: 'Category name, max 255 chars.'
                  example: Infrastructure
                description:
                  type: string
                  description: 'optional Description.'
                  example: 'Infrastructure projects'
                  nullable: true
                is_active:
                  type: boolean
                  description: 'optional Active status.'
                  example: true
              required:
                - code
                - name
  '/api/v1/categories/{category_id}':
    get:
      summary: 'Get single category'
      operationId: getSingleCategory
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Category retrieved successfully'
                  data:
                    id: 1
                    code: CAT001
                    name: 'Category 1'
                    description: Description
                    is_active: true
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Category retrieved successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      code:
                        type: string
                        example: CAT001
                      name:
                        type: string
                        example: 'Category 1'
                      description:
                        type: string
                        example: Description
                      is_active:
                        type: boolean
                        example: true
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
        404:
          description: 'not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 404
                  message: 'Category not found'
                properties:
                  code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: 'Category not found'
      tags:
        - Categories
    put:
      summary: 'Update category'
      operationId: updateCategory
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Category updated successfully'
                  data:
                    id: 1
                    code: CAT001
                    name: 'Infrastructure Updated'
                    description: 'Updated description'
                    is_active: true
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Category updated successfully'
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      code:
                        type: string
                        example: CAT001
                      name:
                        type: string
                        example: 'Infrastructure Updated'
                      description:
                        type: string
                        example: 'Updated description'
                      is_active:
                        type: boolean
                        example: true
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
        404:
          description: 'not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 404
                  message: 'Category not found'
                properties:
                  code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: 'Category not found'
        422:
          description: 'validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 422
                  message: 'Validation error'
                  errors:
                    code:
                      - 'The code has already been taken.'
                properties:
                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'Validation error'
                  errors:
                    type: object
                    properties:
                      code:
                        type: array
                        example:
                          - 'The code has already been taken.'
                        items:
                          type: string
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Category code, max 20 chars, unique.'
                  example: CAT001
                name:
                  type: string
                  description: 'Category name, max 255 chars.'
                  example: Infrastructure
                description:
                  type: string
                  description: 'optional Description.'
                  example: 'Infrastructure projects'
                  nullable: true
                is_active:
                  type: boolean
                  description: 'optional Active status.'
                  example: true
              required:
                - code
                - name
    delete:
      summary: 'Delete category'
      operationId: deleteCategory
      description: ''
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Category deleted successfully'
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Category deleted successfully'
        401:
          description: unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 401
                  message: Unauthenticated
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthenticated
        404:
          description: 'not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 404
                  message: 'Category not found'
                properties:
                  code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: 'Category not found'
        409:
          description: 'has relations'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 409
                  message: 'Cannot delete category with associated projects'
                properties:
                  code:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: 'Cannot delete category with associated projects'
      tags:
        - Categories
    parameters:
      -
        in: path
        name: category_id
        description: 'The ID of the category.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: category
        description: 'The category ID.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/permissions:
    get:
      summary: 'Get all permissions'
      operationId: getAllPermissions
      description: ''
      parameters:
        -
          in: query
          name: grouped
          description: "Return grouped by 'group' field."
          example: true
          required: false
          schema:
            type: boolean
            description: "Return grouped by 'group' field."
            example: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: success
                    type: object
                    example:
                      code: 200
                      message: 'Permissions retrieved successfully'
                      data:
                        -
                          id: 1
                          name: users.view
                          display_name: 'View Users'
                          description: 'Can view users list'
                          group: Users
                          roles_count: 3
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: 'Permissions retrieved successfully'
                      data:
                        type: array
                        example:
                          -
                            id: 1
                            name: users.view
                            display_name: 'View Users'
                            description: 'Can view users list'
                            group: Users
                            roles_count: 3
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: users.view
                            display_name:
                              type: string
                              example: 'View Users'
                            description:
                              type: string
                              example: 'Can view users list'
                            group:
                              type: string
                              example: Users
                            roles_count:
                              type: integer
                              example: 3
                  -
                    description: grouped
                    type: object
                    example:
                      code: 200
                      message: 'Permissions retrieved successfully'
                      data:
                        Users:
                          -
                            id: 1
                            name: users.view
                            display_name: 'View Users'
                        Projects:
                          -
                            id: 2
                            name: projects.view
                            display_name: 'View Projects'
                    properties:
                      code:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: 'Permissions retrieved successfully'
                      data:
                        type: object
                        properties:
                          Users:
                            type: array
                            example:
                              -
                                id: 1
                                name: users.view
                                display_name: 'View Users'
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                name:
                                  type: string
                                  example: users.view
                                display_name:
                                  type: string
                                  example: 'View Users'
                          Projects:
                            type: array
                            example:
                              -
